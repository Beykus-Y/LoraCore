plugins {
    id 'fabric-loom'
    id 'java-library'
}

version = '1.0.0'
group = 'com.lora.tabletos'
archivesBaseName = 'ai_assistant'

// Эта пустая секция говорит Loom "просто подготовь зависимости, но не делай из этого мод"
loom {
    // Эта секция нужна, чтобы Loom правильно настроил classpath для компиляции
}

dependencies {
    // Зависимость от проекта "kernel" для доступа к IApplication, IApplicationApi и т.д.
    api project(':kernel')
    
    // Зависимость от основного мода для доступа к IKernelGraphics, KernelEvent
    compileOnly rootProject.sourceSets.client.output
    
    // Теперь, когда Loom активен, он правильно найдет и обработает эти зависимости,
    // включая SLF4J, который является частью Minecraft/Fabric.
    minecraft "com.mojang:minecraft:${project.rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.rootProject.yarn_mappings}:v2"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.rootProject.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes(
                'App-Main-Class': 'com.lora.tabletos.apps.AiAssistantApp'
        )
    }
}