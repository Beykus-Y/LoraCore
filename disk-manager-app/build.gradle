// --- Файл: disk-manager-app/build.gradle ---

plugins {
    id 'fabric-loom'
    id 'java-library'
}

version = '1.0.0'
group = 'com.lora.tabletos'
archivesBaseName = 'disk-manager-app'

loom {}

dependencies {
    // Зависимость от ядра для доступа к IApplication и API
    compileOnly project(':kernel')

    // Зависимость от основного мода для доступа к Minecraft API через Loom
    compileOnly(rootProject.sourceSets.main.output)

    minecraft "com.mojang:minecraft:${project.rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.rootProject.yarn_mappings}:v2"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.rootProject.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes('App-Main-Class': 'com.lora.tabletos.apps.DiskManagerApp')
    }
}