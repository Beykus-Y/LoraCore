// Шаг 1: Подключаем "магию" Fabric Loom и к этому проекту
plugins {
    id 'fabric-loom'
    id 'java-library'
}

// Шаг 2: Указываем базовую информацию, чтобы Loom был доволен.
// Мы просто берем ее из корневого проекта.
version = project.rootProject.mod_version
group = project.rootProject.maven_group

// Имя нашего JAR-файла остается прежним
archivesBaseName = 'kernel'

// Шаг 3: Настраиваем Loom. Нам не нужно ничего лишнего.
loom {
    // Эта пустая секция говорит Loom "просто подготовь зависимости, но не делай из этого мод"
}

// Шаг 4: Указываем зависимости. Теперь Loom поймет эти строки.
dependencies {
    // Зависимость от основного мода, чтобы видеть IKernel, IKernelApi и т.д.
    compileOnly(rootProject.sourceSets.client.output)
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.rootProject.fabric_version}"
    // Теперь, когда Loom активен, он правильно найдет и обработает эти зависимости
    minecraft "com.mojang:minecraft:${project.rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.rootProject.yarn_mappings}:v2"
}

// Шаг 5: Все, что ниже, остается без изменений. Это уже было правильно.
jar {
    manifest {
        attributes(
                'Kernel-Main-Class': 'com.lora.tabletos.LoraOSKernel'
        )
    }
}

